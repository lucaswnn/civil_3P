[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civil_3P"
version = "0.1.0"
description = "Initial FEM result viewer domain and plugin skeleton"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "PySide6>=6.8",
  "pyvista>=0.45.0",
  "pyvistaqt>=0.11,<0.12",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
